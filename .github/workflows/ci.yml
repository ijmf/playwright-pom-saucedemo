name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar testes
        run: pytest --browser chromium --tracing retain-on-failure

      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: "21"

      - name: Gerar relatório Allure
        if: always()
        run: |
          npx --yes allure-commandline@2.30.0 generate allure-results --clean -o allure-report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Publicar traces de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
